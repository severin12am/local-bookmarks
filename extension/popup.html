<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        font: 13px/1.4 system-ui, sans-serif;
        margin: 0;
        width: 280px;
        background: #09090b;
        color: #e4e4e7;
      }
      main { padding: 14px; }
      h1 { font-size: 14px; margin: 0 0 8px; }
      p { margin: 0 0 10px; color: #a1a1aa; }
      button {
        width: 100%;
        border: 0;
        border-radius: 8px;
        padding: 8px 10px;
        background: #0284c7;
        color: white;
        font-weight: 600;
        cursor: pointer;
      }
      button:disabled { opacity: 0.6; cursor: default; }
      #status { margin-top: 10px; color: #a1a1aa; }
      .ok { color: #6ee7b7; }
      .err { color: #fda4af; }
    </style>
  </head>
  <body>
    <main>
      <h1>Local Bookmarks</h1>
      <p>This app must be running. Stay logged in on x.com, then sync.</p>
      <button id="sync">Sync X bookmarks</button>
      <div id="status"></div>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
